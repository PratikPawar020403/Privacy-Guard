
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Guard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <h1>🛡️ Privacy Guard</h1>
    </header>

    <section class="protection-status">
      <div class="status-label">
        <span id="statusText">Protection Active</span>
        <span id="statusDot" class="status-dot"></span>
      </div>

      <label class="switch">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </section>

    <section class="settings">
      <h2>Protection Settings</h2>

      <label class="setting-option">
        <input type="checkbox" id="detectAadhaar" checked>
        <span>Aadhaar Number</span>
      </label>

      <label class="setting-option">
        <input type="checkbox" id="detectPAN" checked>
        <span>PAN Card</span>
      </label>

      <label class="setting-option">
        <input type="checkbox" id="detectBank" checked>
        <span>Bank Details</span>
      </label>

      <label class="setting-option">
        <input type="checkbox" id="detectPhone" checked>
        <span>Phone Numbers</span>
      </label>
    </section>

    <script src="popup.js"></script>
  </div>
</body>
</html>
